name: 測試

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試套件
        run: python -m pip install -r requirements.txt
      - name: 查詢規則
        run: |
          python -m pytest pipeline/tests -q
          node pipeline/tests/lookup.test.mjs
