name: 測試

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試套件
        run: python -m pip install -r requirements.txt
      - name: 以消費者專區重建快照
        id: site
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python -m pipeline.sync --trigger gha
      - name: 查詢規則
        run: |
          python -m pytest pipeline/tests -q
          node pipeline/tests/lookup.test.mjs
      - name: 留下專區原始檔
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-snapshot
          path: data/site
          if-no-files-found: ignore
      - name: 把專區快照推回拉取請求
        if: github.event_name == 'pull_request' && steps.site.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --staged --quiet; then
            echo "沒有新的專區快照"
          else
            git commit -m "data: 以消費者專區為準更新容許量與禁用名單"
            git push
          fi
